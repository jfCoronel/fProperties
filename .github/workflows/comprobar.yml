# Lint y tests en cada push a main y en cada pull request. Es la misma puerta que
# pasa la publicación, pero avisa antes de llegar a etiquetar.
name: Comprobar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
